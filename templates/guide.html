<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWAMP · User Guide</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      height: 52px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header a.brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: #4fc3f7;
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    header a.back {
      margin-left: auto;
      font-size: 0.85rem;
      color: #90caf9;
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid #0f3460;
      border-radius: 6px;
    }

    header a.back:hover { background: #0f3460; }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* typography */
    h1 { font-size: 2rem; color: #4fc3f7; margin-bottom: 8px; }
    h2 { font-size: 1.4rem; color: #81d4fa; margin: 2rem 0 0.6rem; border-bottom: 1px solid #0f3460; padding-bottom: 6px; }
    h3 { font-size: 1.1rem; color: #b3e5fc; margin: 1.4rem 0 0.4rem; }
    h4 { font-size: 0.95rem; color: #e0e0e0; margin: 1rem 0 0.3rem; }

    p  { line-height: 1.7; margin: 0.6rem 0; }

    a  { color: #4fc3f7; }

    strong { color: #fff; }

    code {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.85em;
      background: #0f3460;
      padding: 2px 6px;
      border-radius: 4px;
    }

    pre {
      background: #0d1b2a;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 1rem 0;
    }

    pre code {
      background: none;
      padding: 0;
      font-size: 0.88em;
      color: #b3e5fc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.9rem;
    }

    th {
      background: #0f3460;
      color: #81d4fa;
      text-align: left;
      padding: 8px 12px;
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid #1e2a4a;
    }

    tr:hover td { background: #1e2a4a; }

    ul, ol {
      padding-left: 1.5rem;
      margin: 0.6rem 0;
      line-height: 1.8;
    }

    hr {
      border: none;
      border-top: 1px solid #0f3460;
      margin: 2rem 0;
    }

    blockquote {
      border-left: 3px solid #0f3460;
      padding-left: 1rem;
      color: #90caf9;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">💧 SWAMP</a>
    <a class="back" href="/">← Back to map</a>
  </header>
  <main>
    {{ content|safe }}
  </main>
</body>
</html>

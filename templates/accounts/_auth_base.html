{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SWAMP{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'img/SPARRSO_logo_20260121.png' %}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1a3a5c 0%, #0d1b2a 60%, #050b13 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 28px 26px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .brand-mark {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg,#1565c0,#29b6f6 70%,#80deea);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      box-shadow: inset 0 0 12px rgba(255,255,255,.15);
    }
    .brand-name { font-weight: 700; font-size: 18px; color: #4fc3f7; letter-spacing: .5px; }
    .brand-sub  { font-size: 11px; color: #78909c; }
    h1 {
      font-size: 18px;
      color: #e0e0e0;
      margin: 22px 0 14px;
      font-weight: 600;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 11px;
      color: #78909c;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 9px 12px;
      background: #0d1b2a;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: #29b6f6; }
    .submit {
      width: 100%;
      padding: 10px;
      background: #1565c0;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background .15s;
    }
    .submit:hover { background: #1976d2; }
    .alt-link {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #78909c;
    }
    .alt-link a { color: #4fc3f7; text-decoration: none; }
    .alt-link a:hover { text-decoration: underline; }
    .error {
      background: rgba(198,40,40,.15);
      border: 1px solid #c62828;
      color: #ffcdd2;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-water"></i></div>
      <div>
        <div class="brand-name">SWAMP</div>
        <div class="brand-sub">Surface Water Monitoring Platform · SPARRSO</div>
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
